; Основные настройки для задания 6 (обычный режим).
file_uploads = On
upload_max_filesize = 20M
post_max_size = 25M
max_file_uploads = 10
memory_limit = 128M
max_input_time = 60
max_execution_time = 30
date.timezone = UTC

; Не выводить PHP startup warning в HTTP-ответ: иначе при POST > post_max_size
; заголовок Location может не отправиться. Ошибки остаются в журнале сервера.
display_errors = Off
log_errors = On
